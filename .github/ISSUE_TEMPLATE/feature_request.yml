name: Request a feature
description: An idea that would make studying with Module Builder better.
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Module Builder to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it help you study?
      description: The situation where you'd use it.
